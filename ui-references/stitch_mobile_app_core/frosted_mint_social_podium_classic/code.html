<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMTL — Social Podium (Classic)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-canvas': '#EBF5EE',
            'forest': '#145C40',
            'forest-deep': '#0E3F2C',
            'ink': '#12291F',
            'ink-muted': '#415E52',
          },
          fontFamily: {
            'display': ['"Instrument Serif"', 'Georgia', 'serif'],
            'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .apple-spring { transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 220ms ease, box-shadow 220ms ease; }
    .apple-glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.88); box-shadow: 0 10px 30px -10px rgba(20, 92, 64, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
    .podium-first { background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(226, 245, 233, 0.78) 100%); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 14px 32px -10px rgba(20, 92, 64, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.95); }
  </style>
</head>
<body class="bg-mint-canvas text-ink font-sans antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto relative overflow-hidden flex flex-col justify-between pb-28" style="background: radial-gradient(120% 80% at 15% 0%, #FFFFFF 0%, #EAF6EE 48%, #D7EDE0 100%);" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Top Header -->
    <header class="relative z-10 px-5 pt-6 pb-2 flex items-center justify-between gap-3">
      <div>
        <h1 class="font-display text-3xl text-ink leading-tight">Today&#39;s podium</h1>
        <p class="text-xs text-ink-muted">Your friend group · Montréal</p>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <span role="status" class="apple-glass inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold text-ink tabular-nums">
          <span class="material-symbols-outlined text-[15px] text-forest" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">bolt</span>
          <span>320 XP</span>
        </span>
        <a href="../frosted-profile/FrostedProfile.html" aria-label="Open My Profile" class="apple-spring w-10 h-10 rounded-full bg-forest text-white border-2 border-white shadow-md flex items-center justify-center text-xs font-bold hover:scale-105 active:scale-95">
          ES
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 px-5 flex-1 flex flex-col gap-5 pt-2">
      <!-- Scope Toggle -->
      <div class="apple-glass rounded-full p-1 grid grid-cols-2 gap-1">
        <button type="button" class="min-h-10 rounded-full bg-ink text-white text-xs font-semibold shadow-sm">Friends</button>
        <button type="button" class="min-h-10 rounded-full text-ink-muted hover:text-ink text-xs font-semibold">Montréal</button>
      </div>

      <!-- Classic 3-Step Glass Podium -->
      <section aria-label="Top 3 friends today" class="pt-2">
        <div class="grid grid-cols-3 gap-2.5 items-end">
          <!-- 2nd Place -->
          <div class="flex flex-col items-center gap-2">
            <div class="relative">
              <div class="w-12 h-12 rounded-full bg-white text-ink border-2 border-white shadow-sm flex items-center justify-center text-xs font-bold">
                PG
              </div>
              <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-ink text-white text-[10px] font-bold flex items-center justify-center border-2 border-white tabular-nums">2</span>
            </div>
            <div class="text-center">
              <p class="text-xs font-semibold text-ink truncate max-w-[96px]">PlateauGreen</p>
              <p class="text-[11px] font-semibold text-ink-muted tabular-nums">+95 XP</p>
            </div>
            <div class="w-full h-24 apple-glass rounded-t-3xl rounded-b-2xl flex items-end justify-center pb-3">
              <span class="font-display text-2xl text-ink-muted">2</span>
            </div>
          </div>

          <!-- 1st Place -->
          <div class="flex flex-col items-center gap-2">
            <div class="relative">
              <div class="w-14 h-14 rounded-full bg-forest text-white border-2 border-white shadow-md flex items-center justify-center text-sm font-bold">
                ML
              </div>
              <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-white text-forest shadow-sm flex items-center justify-center">
                <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">emoji_events</span>
              </span>
            </div>
            <div class="text-center">
              <p class="text-xs font-bold text-ink truncate max-w-[100px]">MileEndLeaf</p>
              <p class="text-xs font-bold text-forest tabular-nums">+120 XP</p>
            </div>
            <div class="w-full h-32 podium-first rounded-t-3xl rounded-b-2xl flex items-end justify-center pb-3">
              <span class="font-display text-3xl text-forest">1</span>
            </div>
          </div>

          <!-- 3rd Place (You) -->
          <div class="flex flex-col items-center gap-2">
            <div class="relative">
              <div class="w-12 h-12 rounded-full bg-forest-deep text-white border-2 border-white shadow-sm flex items-center justify-center text-xs font-bold">
                ES
              </div>
              <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-forest text-white text-[10px] font-bold flex items-center justify-center border-2 border-white tabular-nums">3</span>
            </div>
            <div class="text-center">
              <p class="text-xs font-bold text-ink truncate max-w-[96px]">You</p>
              <p class="text-[11px] font-semibold text-forest tabular-nums">+75 XP</p>
            </div>
            <div class="w-full h-20 rounded-t-3xl rounded-b-2xl bg-forest text-white shadow-md flex items-end justify-center pb-3">
              <span class="font-display text-2xl text-white">3</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Remaining Friends Today -->
      <section aria-label="Rest of friend group" class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-ink-muted">Also sorting today</h2>
          <span class="text-xs text-ink-muted">Resets midnight</span>
        </div>

        <div class="apple-glass rounded-2xl px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-white text-ink text-xs font-bold flex items-center justify-center tabular-nums">4</span>
            <span class="text-sm font-semibold text-ink">VerdunRecycle</span>
          </div>
          <span class="text-xs font-bold text-ink-muted tabular-nums">+50 XP</span>
        </div>

        <div class="apple-glass rounded-2xl px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-white text-ink text-xs font-bold flex items-center justify-center tabular-nums">5</span>
            <span class="text-sm font-semibold text-ink">RosemontBin</span>
          </div>
          <span class="text-xs font-bold text-ink-muted tabular-nums">+30 XP</span>
        </div>
      </section>

      <!-- Share CTA -->
      <button type="button" class="apple-spring w-full min-h-14 rounded-full bg-ink text-white shadow-lg flex items-center justify-center gap-2 text-sm font-semibold hover:bg-forest-deep active:scale-[0.97]">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">ios_share</span>
        <span>Share today&#39;s podium</span>
      </button>
    </main>

    <!-- Floating Apple Glass Tab Bar -->
    <nav aria-label="Primary navigation" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-36px)] max-w-[354px] z-30">
      <div class="apple-glass rounded-full p-1.5 grid grid-cols-3 gap-1 shadow-xl">
        <a href="../frosted-scan-viewfinder/FrostedScanViewfinder.html" class="apple-spring min-h-12 rounded-full text-ink-muted hover:text-ink flex items-center justify-center gap-1.5 text-xs font-semibold">
          <span class="material-symbols-outlined text-[19px]" aria-hidden="true">qr_code_scanner</span>
          <span>Scan</span>
        </a>
        <a href="../frosted-play/FrostedPlay.html" class="apple-spring min-h-12 rounded-full text-ink-muted hover:text-ink flex items-center justify-center gap-1.5 text-xs font-semibold">
          <span class="material-symbols-outlined text-[19px]" aria-hidden="true">stadia_controller</span>
          <span>Play</span>
        </a>
        <a href="../frosted-social/FrostedSocial.html" class="apple-spring min-h-12 rounded-full bg-ink text-white flex items-center justify-center gap-1.5 text-xs font-semibold">
          <span class="material-symbols-outlined text-[19px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">leaderboard</span>
          <span>Social</span>
        </a>
      </div>
    </nav>
  </div>


</body></html>
