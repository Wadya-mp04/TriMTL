<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMTL — Identifying Items</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-canvas': '#E5F3EA',
            'forest': '#176B4D',
            'forest-deep': '#123629',
            'ink': '#12291F',
            'ink-muted': '#415E52',
          },
          fontFamily: {
            'display': ['"Instrument Serif"', 'Georgia', 'serif'],
            'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .apple-glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.88); box-shadow: 0 10px 30px -10px rgba(20, 92, 64, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
  </style>
</head>
<body class="bg-mint-canvas text-ink font-sans antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto relative overflow-hidden flex flex-col justify-between px-5 py-10" style="background: radial-gradient(120% 80% at 15% 0%, #FFFFFF 0%, #E5F3EA 48%, #D4EBDD 100%);" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="flex items-center justify-between">
      <a href="../frosted-review-photos/FrostedReviewPhotos.html" aria-label="Cancel analysis" class="apple-glass w-11 h-11 rounded-full flex items-center justify-center text-ink">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span>
      </a>
      <span class="apple-glass px-3.5 py-1.5 rounded-full text-xs font-semibold text-forest">Gemini Vision</span>
      <span class="w-11"></span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center text-center gap-6">
      <!-- Photo Thumbnails -->
      <div class="flex items-center justify-center gap-3">
        <span class="w-16 h-16 rounded-2xl apple-glass flex items-center justify-center text-forest">
          <span class="material-symbols-outlined text-[26px]" aria-hidden="true">local_drink</span>
        </span>
        <span class="w-16 h-16 rounded-2xl apple-glass flex items-center justify-center text-forest">
          <span class="material-symbols-outlined text-[26px]" aria-hidden="true">battery_charging_full</span>
        </span>
      </div>

      <!-- Animated Sparkle Scanner Card -->
      <section class="apple-glass rounded-3xl p-7 w-full flex flex-col items-center gap-4">
        <span class="w-16 h-16 rounded-full bg-forest text-white shadow-lg flex items-center justify-center animate-pulse">
          <span class="material-symbols-outlined text-[32px]" aria-hidden="true">auto_awesome</span>
        </span>
        <div>
          <h1 class="font-display text-3xl text-ink leading-tight">Identifying your items...</h1>
          <p class="text-xs text-ink-muted mt-1.5">We&#39;re checking what you&#39;ve scanned.</p>
        </div>
        <!-- Indeterminate Smooth Bar -->
        <div class="w-full h-2 rounded-full bg-white/80 overflow-hidden">
          <div class="h-full w-1/2 bg-forest rounded-full animate-pulse"></div>
        </div>
      </section>

      <a href="../frosted-sorted-list/FrostedSortedList.html" class="min-h-11 px-6 rounded-full bg-ink text-white text-xs font-semibold inline-flex items-center justify-center">
        View detected items
      </a>
    </main>

    <footer class="text-center">
      <button id="btn-retry-demo" type="button" class="text-xs font-semibold text-ink-muted hover:text-ink">
        Having trouble? Retry analysis
      </button>
    </footer>
  </div>


</body></html>
