<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMTL — Sign In &amp; Sign Up</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-canvas': '#E5F3EA',
            'forest': '#176B4D',
            'forest-deep': '#123629',
            'ink': '#12291F',
            'ink-muted': '#415E52',
          },
          fontFamily: {
            'display': ['"Instrument Serif"', 'Georgia', 'serif'],
            'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .apple-spring { transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 220ms ease, box-shadow 220ms ease; }
    .apple-glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.88); box-shadow: 0 10px 30px -10px rgba(20, 92, 64, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
  </style>
</head>
<body class="bg-mint-canvas text-ink font-sans antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto relative overflow-hidden flex flex-col justify-center px-5 py-10" style="background: radial-gradient(120% 80% at 15% 0%, #FFFFFF 0%, #E5F3EA 48%, #D4EBDD 100%);" data-stitch-vh="min-h-[884px]===min-h-screen">
    <main class="flex flex-col gap-6">
      <!-- Brand Mark -->
      <div class="flex flex-col items-center text-center gap-3">
        <span class="w-16 h-16 rounded-3xl bg-forest text-white shadow-lg flex items-center justify-center">
          <span class="material-symbols-outlined text-[32px]" aria-hidden="true">eco</span>
        </span>
        <div>
          <h1 class="font-display text-4xl text-ink leading-tight">TriMTL</h1>
          <p class="text-sm text-ink-muted mt-1">Scan it. Sort it. Learn Montréal.</p>
        </div>
      </div>

      <!-- Auth Frosted Card -->
      <section class="apple-glass rounded-3xl p-5 flex flex-col gap-4">
        <!-- Segmented Toggle -->
        <div class="rounded-full bg-white/70 p-1 grid grid-cols-2 gap-1 border border-white">
          <button id="tab-signin" type="button" class="min-h-10 rounded-full bg-ink text-white text-xs font-semibold shadow-sm">Sign in</button>
          <button id="tab-signup" type="button" class="min-h-10 rounded-full text-ink-muted hover:text-ink text-xs font-semibold">Sign up</button>
        </div>

        <form class="flex flex-col gap-3">
          <div id="username-field" class="hidden flex-col gap-1">
            <label for="auth-name" class="text-xs font-semibold text-ink pl-1">Username</label>
            <input id="auth-name" type="text" placeholder="EcoSorter" class="w-full min-h-12 rounded-2xl bg-white/90 border border-white px-4 text-sm text-ink placeholder:text-ink-muted focus:border-forest focus:ring-forest">
          </div>

          <div class="flex flex-col gap-1">
            <label for="auth-email" class="text-xs font-semibold text-ink pl-1">Email</label>
            <input id="auth-email" type="email" placeholder="ecosorter@montreal.ca" class="w-full min-h-12 rounded-2xl bg-white/90 border border-white px-4 text-sm text-ink placeholder:text-ink-muted focus:border-forest focus:ring-forest">
          </div>

          <div class="flex flex-col gap-1">
            <label for="auth-password" class="text-xs font-semibold text-ink pl-1">Password</label>
            <input id="auth-password" type="password" placeholder="••••••••" class="w-full min-h-12 rounded-2xl bg-white/90 border border-white px-4 text-sm text-ink placeholder:text-ink-muted focus:border-forest focus:ring-forest">
          </div>

          <a id="auth-submit" href="../frosted-scan-viewfinder/FrostedScanViewfinder.html" class="apple-spring mt-2 w-full min-h-14 rounded-full bg-ink text-white shadow-lg flex items-center justify-center text-base font-semibold hover:bg-forest-deep active:scale-[0.97]">
            Sign in
          </a>
        </form>
      </section>

      <!-- Continue Demo -->
      <div class="text-center">
        <a href="../frosted-scan-viewfinder/FrostedScanViewfinder.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-forest hover:opacity-80">
          <span>Continue demo without account</span>
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span>
        </a>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var tabIn = document.getElementById('tab-signin');
      var tabUp = document.getElementById('tab-signup');
      var nameField = document.getElementById('username-field');
      var submitBtn = document.getElementById('auth-submit');

      tabIn.addEventListener('click', function () {
        tabIn.className = 'min-h-10 rounded-full bg-ink text-white text-xs font-semibold shadow-sm';
        tabUp.className = 'min-h-10 rounded-full text-ink-muted hover:text-ink text-xs font-semibold';
        nameField.classList.add('hidden');
        nameField.classList.remove('flex');
        submitBtn.textContent = 'Sign in';
      });
      tabUp.addEventListener('click', function () {
        tabUp.className = 'min-h-10 rounded-full bg-ink text-white text-xs font-semibold shadow-sm';
        tabIn.className = 'min-h-10 rounded-full text-ink-muted hover:text-ink text-xs font-semibold';
        nameField.classList.remove('hidden');
        nameField.classList.add('flex');
        submitBtn.textContent = 'Create account';
      });
    })();
  </script>


</body></html>
