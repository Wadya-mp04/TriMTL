<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMTL — Camera Capture</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-canvas': '#E5F3EA',
            'forest': '#176B4D',
            'forest-deep': '#123629',
            'ink': '#12291F',
            'ink-muted': '#415E52',
          },
          fontFamily: {
            'display': ['"Instrument Serif"', 'Georgia', 'serif'],
            'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .apple-spring { transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 220ms ease, box-shadow 220ms ease; }
    .apple-glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.88); box-shadow: 0 10px 30px -10px rgba(20, 92, 64, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
  </style>
</head>
<body class="bg-mint-canvas text-ink font-sans antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto relative overflow-hidden flex flex-col justify-between pb-8" style="background: radial-gradient(120% 80% at 15% 0%, #FFFFFF 0%, #E5F3EA 48%, #D4EBDD 100%);" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Camera Bar -->
    <header class="px-5 pt-6 pb-3 flex items-center justify-between gap-3">
      <a href="../frosted-scan-viewfinder/FrostedScanViewfinder.html" aria-label="Close camera" class="apple-spring apple-glass w-11 h-11 rounded-full flex items-center justify-center text-ink hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span>
      </a>

      <span id="shot-counter" role="status" class="apple-glass px-3.5 py-1.5 rounded-full text-xs font-semibold text-ink tabular-nums">
        1 of 3 photos
      </span>

      <button type="button" aria-label="Toggle flash" class="apple-spring apple-glass w-11 h-11 rounded-full flex items-center justify-center text-ink hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">flash_auto</span>
      </button>
    </header>

    <!-- Viewfinder Frame -->
    <main class="px-5 flex-1 flex flex-col justify-center gap-5">
      <section class="relative rounded-3xl bg-forest-deep/10 border-2 border-white shadow-inner min-h-96 flex flex-col items-center justify-center p-6 text-center overflow-hidden">
        <!-- Corner Focus Brackets -->
        <div aria-hidden="true" class="absolute top-5 left-5 w-6 h-6 border-t-2 border-l-2 border-forest rounded-tl-lg"></div>
        <div aria-hidden="true" class="absolute top-5 right-5 w-6 h-6 border-t-2 border-r-2 border-forest rounded-tr-lg"></div>
        <div aria-hidden="true" class="absolute bottom-5 left-5 w-6 h-6 border-b-2 border-l-2 border-forest rounded-bl-lg"></div>
        <div aria-hidden="true" class="absolute bottom-5 right-5 w-6 h-6 border-b-2 border-r-2 border-forest rounded-br-lg"></div>

        <span class="w-16 h-16 rounded-full bg-white/90 shadow-md flex items-center justify-center text-forest mb-3">
          <span class="material-symbols-outlined text-[32px]" aria-hidden="true">center_focus_strong</span>
        </span>
        <p class="font-display text-2xl text-ink">Frame up to 5 items</p>
        <p class="text-xs text-ink-muted mt-1">Tap the shutter to snap another photo</p>
      </section>

      <!-- Captured Thumbnails Strip (1–3 photos) -->
      <section aria-label="Captured photos" class="flex items-center justify-center gap-3">
        <div class="w-16 h-16 rounded-2xl bg-white border-2 border-forest shadow-sm flex items-center justify-center text-forest">
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">local_cafe</span>
        </div>
        <div id="slot-2" class="w-16 h-16 rounded-2xl apple-glass flex items-center justify-center text-ink-muted">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">add</span>
        </div>
        <div id="slot-3" class="w-16 h-16 rounded-2xl apple-glass flex items-center justify-center text-ink-muted">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">add</span>
        </div>
      </section>
    </main>

    <!-- Bottom Shutter & Analyze Controls -->
    <footer class="px-5 pt-4 flex items-center justify-between gap-4">
      <a href="../frosted-photo-picker/FrostedPhotoPicker.html" aria-label="Open photo library" class="apple-spring apple-glass w-12 h-12 rounded-2xl flex items-center justify-center text-ink hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">photo_library</span>
      </a>

      <!-- Apple Shutter Button -->
      <button id="btn-shutter" type="button" aria-label="Take photo" class="apple-spring w-20 h-20 rounded-full bg-white border-4 border-forest p-1 shadow-lg flex items-center justify-center hover:scale-105 active:scale-90">
        <span class="w-full h-full rounded-full bg-forest"></span>
      </button>

      <a href="../frosted-review-photos/FrostedReviewPhotos.html" class="apple-spring min-h-12 px-5 rounded-full bg-ink text-white shadow-md flex items-center justify-center gap-1.5 text-sm font-semibold hover:bg-forest-deep active:scale-95">
        <span>Analyze</span>
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span>
      </a>
    </footer>
  </div>

  <script>
    (function () {
      var shots = 1;
      var counter = document.getElementById('shot-counter');
      document.getElementById('btn-shutter').addEventListener('click', function () {
        if (shots >= 3) return;
        shots += 1;
        counter.textContent = shots + ' of 3 photos';
        var slot = document.getElementById('slot-' + shots);
        if (slot) {
          slot.className = 'w-16 h-16 rounded-2xl bg-white border-2 border-forest shadow-sm flex items-center justify-center text-forest';
          slot.innerHTML = '<span class="material-symbols-outlined text-[24px]" aria-hidden="true">battery_charging_full</span>';
        }
      });
    })();
  </script>


</body></html>
