<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriMTL — Frosted Mint Profile</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mint-canvas': '#EBF5EE',
            'forest': '#145C40',
            'forest-deep': '#0E3F2C',
            'ink': '#12291F',
            'ink-muted': '#516B5F',
            'ocean': '#0E7490',
            'lavender': '#7C3AED',
          },
          fontFamily: {
            'display': ['"Instrument Serif"', 'Georgia', 'serif'],
            'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    .apple-spring { transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background-color 220ms ease, box-shadow 220ms ease; }
    .apple-glass { background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.85); box-shadow: 0 10px 30px -10px rgba(20, 92, 64, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
    .bento-tile { background: linear-gradient(145deg, rgba(255,255,255,0.65), rgba(221,241,228,0.35)); border: 1px solid rgba(255,255,255,0.75); }
  </style>
</head>
<body class="bg-mint-canvas text-ink font-sans antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto relative overflow-hidden flex flex-col justify-between pb-10" style="background: radial-gradient(120% 80% at 15% 0%, #FFFFFF 0%, #EAF6EE 48%, #D7EDE0 100%);" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-16 px-4 grid grid-cols-3 gap-3 opacity-55">
      <div class="h-24 rounded-3xl bento-tile"></div>
      <div class="h-24 rounded-3xl bento-tile"></div>
      <div class="h-24 rounded-3xl bento-tile"></div>
    </div>

    <!-- Contextual Header (No Bottom Tabs) -->
    <header class="relative z-10 px-5 pt-6 pb-3 flex items-center justify-between gap-3">
      <a href="../frosted-scan-viewfinder/FrostedScanViewfinder.html" aria-label="Back to Scan" class="apple-spring apple-glass w-11 h-11 rounded-full flex items-center justify-center text-ink hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </a>
      <h1 class="font-display text-2xl text-ink">My Profile</h1>
      <button type="button" aria-label="Settings" class="apple-spring apple-glass w-11 h-11 rounded-full flex items-center justify-center text-ink hover:scale-105 active:scale-95">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">settings</span>
      </button>
    </header>

    <!-- Main Profile Content -->
    <main class="relative z-10 px-5 flex-1 flex flex-col gap-4 pt-1">
      <!-- Identity Glass Card -->
      <article class="apple-glass rounded-3xl p-5 flex flex-col gap-4">
        <div class="flex items-center gap-4">
          <span class="w-16 h-16 rounded-full bg-forest text-white text-xl font-bold shadow-md flex items-center justify-center shrink-0">ES</span>
          <div>
            <h2 class="text-xl font-bold text-ink">EcoSorter</h2>
            <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-white text-forest text-xs font-semibold shadow-sm">Level 3 • Montréal</span>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between text-xs font-semibold">
            <span class="text-ink-muted">Level progress</span>
            <span class="text-forest tabular-nums">320 / 500 XP</span>
          </div>
          <div class="w-full h-2.5 rounded-full bg-white/80 overflow-hidden">
            <div class="h-full bg-forest rounded-full" style="width: 64%;"></div>
          </div>
        </div>
      </article>

      <!-- 3 Frosted Stats Cards -->
      <section aria-label="Stats" class="grid grid-cols-3 gap-2.5">
        <div class="apple-glass rounded-2xl p-3 text-center">
          <p class="text-xl font-bold text-forest tabular-nums">320</p>
          <p class="text-xs text-ink-muted">Total XP</p>
        </div>
        <div class="apple-glass rounded-2xl p-3 text-center">
          <p class="text-xl font-bold text-ink tabular-nums">88%</p>
          <p class="text-xs text-ink-muted">Accuracy</p>
        </div>
        <div class="apple-glass rounded-2xl p-3 text-center">
          <p class="text-xl font-bold text-ink tabular-nums">12</p>
          <p class="text-xs text-ink-muted">Games</p>
        </div>
      </section>

      <!-- 3 Frosted Theme Tiles -->
      <section class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-sm font-bold text-ink">App theme</h2>
          <span class="text-xs font-semibold text-forest">All 3 unlocked</span>
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <button type="button" class="apple-spring apple-glass rounded-2xl p-3 border-2 border-forest flex flex-col items-center gap-1.5 text-center">
            <span class="w-8 h-8 rounded-full bg-forest text-white flex items-center justify-center">
              <span class="material-symbols-outlined text-[16px]" aria-hidden="true">check</span>
            </span>
            <span class="text-xs font-bold text-ink">Forest</span>
          </button>
          <button type="button" class="apple-spring apple-glass rounded-2xl p-3 flex flex-col items-center gap-1.5 text-center hover:scale-[1.02]">
            <span class="w-8 h-8 rounded-full bg-ocean text-white"></span>
            <span class="text-xs font-semibold text-ink">Ocean</span>
          </button>
          <button type="button" class="apple-spring apple-glass rounded-2xl p-3 flex flex-col items-center gap-1.5 text-center hover:scale-[1.02]">
            <span class="w-8 h-8 rounded-full bg-lavender text-white"></span>
            <span class="text-xs font-semibold text-ink">Lavender</span>
          </button>
        </div>
      </section>

      <!-- Recent Games -->
      <section class="flex flex-col gap-2">
        <h2 class="text-sm font-bold text-ink px-1">Recent games</h2>
        <div class="apple-glass rounded-2xl px-4 py-3 flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold text-ink">My scanned items</p>
            <p class="text-xs text-ink-muted">4 items • Today</p>
          </div>
          <span class="text-xs font-bold text-forest tabular-nums">100 / 100</span>
        </div>
        <div class="apple-glass rounded-2xl px-4 py-3 flex items-center justify-between">
          <div>
            <p class="text-sm font-semibold text-ink">Daily challenge</p>
            <p class="text-xs text-ink-muted">5 items • Yesterday</p>
          </div>
          <span class="text-xs font-bold text-ink-muted tabular-nums">80 / 100</span>
        </div>
      </section>

      <footer class="pt-1 text-center">
        <a href="../frosted-auth/FrostedAuth.html" class="inline-flex items-center justify-center min-h-11 px-4 text-xs font-semibold text-ink-muted hover:text-ink">Sign out</a>
      </footer>
    </main>
  </div>


</body></html>
